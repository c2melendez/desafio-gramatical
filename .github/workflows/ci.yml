name: Verificar Academia PHUMA Play

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verificar:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Instalar dependencias
        id: install_cert_deps
        run: bun install --frozen-lockfile
      - name: Compilar aplicación y generar rutas de TanStack Router
        run: bun run build
      - name: Ejecutar pruebas
        run: bun run test
      - name: Validar inventario y grafo de módulos
        run: |
          node scripts/test-inventory.mjs
          node --import ./scripts/ts-resolve.mjs scripts/test-inventory-items.mjs
          node --import ./scripts/ts-resolve.mjs scripts/test-audit-m0-baseline-quality.mjs
          node --import ./scripts/ts-resolve.mjs scripts/test-m0-critical-mutations.mjs
          python3 scripts/check_m0_contract_lock.py
          python3 -m unittest discover -s scripts -p 'test_check_m0_contract_lock.py'
          python3 scripts/validate_modules.py
          python3 -m unittest discover -s scripts -p 'test_validate_modules.py'
          python3 -m unittest discover -s scripts -p 'test_qa_m0.py'
          python3 -m unittest discover -s scripts -p 'test_verify_state.py'
          python3 -m unittest discover -s scripts -p 'test_verify_m0_report.py'
          python3 -m unittest discover -s scripts -p 'test_audit_stem_m0_overlap.py'
          node scripts/test-review-draft.mjs
          python3 scripts/validate_editorial_review.py
          python3 -m unittest discover -s scripts -p 'test_editorial_review.py'
          node scripts/test-quarantine.mjs
          node scripts/check-family-evidence.mjs
          node scripts/test-selection-audit.mjs
          node scripts/test-content-contracts.mjs
          node scripts/check-selection-oracles.mjs
          node scripts/privacy-m0-static.mjs --test
          node scripts/privacy-m0-static.mjs
          node scripts/security-client-audit.mjs --test
          node scripts/security-client-audit.mjs
      - name: v7.8.1 - verificar integridad de PDF originales y guard G-ACTION
        run: |
          python3 qa/certification/verify_sources.py
          node --import ./scripts/ts-resolve.mjs --test qa/certification/test-select-frozen.mjs qa/certification/rdg/test-validate.mjs qa/certification/rdg/test-incremental-index.mjs
          python3 -m unittest discover -s qa/certification -p 'test_guard_avance_phuma_v7_6.py' -v
          node --import ./scripts/ts-resolve.mjs qa/certification/rdg/incremental-index.mjs > qa-rdg-work-queue.json
      - name: STEM-05 - conservar cola incremental por ID y hash
        uses: actions/upload-artifact@v4
        with:
          name: phuma-rdg-incremental-work-queue
          path: qa-rdg-work-queue.json
          if-no-files-found: error
          retention-days: 30
      - name: Diagnóstico técnico legado - auditar hasta 450 registros sin certificación semántica
        if: ${{ !cancelled() && steps.install_cert_deps.outcome == 'success' }}
        run: |
          node --import ./scripts/ts-resolve.mjs qa/certification/audit-450.mjs > qa-batch-450-summary.json
          cat qa-batch-450-summary.json
      - name: Diagnóstico técnico legado - archivar expedientes individuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-certification-batch-450
          path: |
            qa-batch-450-summary.json
            qa/certification/evidence/batch-450.json
          if-no-files-found: error
          retention-days: 30
      - name: Certificación PAA/PHUMA V1 - comprobar contratos, oráculos y mapeo sin Inglés
        if: ${{ !cancelled() && steps.install_cert_deps.outcome == 'success' }}
        run: node --import ./scripts/ts-resolve.mjs qa/certification/run.mjs > qa-certification-summary.json
      - name: Certificación C02-C04 - comprobar reglas originales y priorizar distractores
        run: |
          node --import ./scripts/ts-resolve.mjs qa/certification/original-spanish-review.mjs > qa-original-spanish-summary.json
          cat qa-original-spanish-summary.json
      - name: Certificación C02-C04 - revisar 62 alertas de alto impacto por contexto y linaje
        run: |
          node --import ./scripts/ts-resolve.mjs qa/certification/high-impact-review.mjs > qa-high-impact-summary.json
          cat qa-high-impact-summary.json
      - name: Certificación C02-C04 - archivar revisión individual prioritaria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-spanish-62-high-impact-review
          path: |
            qa-high-impact-summary.json
            qa/certification/evidence/high-impact-review.json
          if-no-files-found: error
          retention-days: 30
      - name: Certificación C02-C04 - archivar reglas verificadas y cola editorial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-spanish-original-rules-editorial
          path: |
            qa-original-spanish-summary.json
            qa/certification/evidence/original-spanish-rules.json
            qa/certification/evidence/distractor-review-queue.json
          if-no-files-found: error
          retention-days: 30
      - name: Certificación C02 - derivar claves de Español desde fuentes y auditar distractores
        run: node --import ./scripts/ts-resolve.mjs qa/certification/semantic-lineage.mjs > qa-semantic-lineage-summary.json
      - name: Certificación C02 - conservar linaje y alertas editoriales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-spanish-semantic-lineage
          path: |
            qa-semantic-lineage-summary.json
            qa/certification/evidence/semantic-lineage.json
          if-no-files-found: error
          retention-days: 30
      - name: Certificación C01-C02 - trazabilidad individual y oráculos de Español
        run: node --import ./scripts/ts-resolve.mjs qa/certification/traceability.mjs > qa-spanish-trace-summary.json
      - name: Certificación C01-C02 - conservar 40500 trazas y diagnóstico de Español
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-item-trace-spanish-oracles
          path: |
            qa-spanish-trace-summary.json
            qa/certification/evidence/item-trace.json
            qa/certification/evidence/spanish-oracles.json
          if-no-files-found: error
          retention-days: 30
      - name: Certificación PAA/PHUMA V1 - archivar reporte reproducible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academia-exam-certification-v1
          path: |
            qa-certification-summary.json
            qa/certification/evidence/latest.json
          if-no-files-found: error
          retention-days: 30
      - name: Congelar inventario reproducible por ruta, juego y nivel
        run: |
          node --import ./scripts/ts-resolve.mjs scripts/inventory-coverage.mjs > m0-inventory.json
          node -e "const i=require('./m0-inventory.json'); console.log(JSON.stringify(i.resumen)); if (!i.resumen || i.rows.length !== 810 || i.resumen.celdas !== 810) process.exit(1); if (i.arbol_modificado) console.warn('Checkout con archivos generados modificados; revisar antes del cierre, no equivale a diferencias de contenido')"
      - name: Congelar inventario individual y detectar colisiones de ID
        run: node --import ./scripts/ts-resolve.mjs scripts/inventory-items.mjs > m0-inventory-items.json
      - name: STEM PHUMA Pair - exportar huellas MAT-ARIT-01
        run: node --import ./scripts/ts-resolve.mjs scripts/phuma-pair-operations-index.mjs > phuma-pair-operations-index.json
      - name: Conservar índice PHUMA Pair sin claves
        uses: actions/upload-artifact@v4
        with:
          name: phuma-pair-operations-index
          path: phuma-pair-operations-index.json
          if-no-files-found: error
      - name: Congelar triaje estructural y estado editorial M0
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m0-baseline-quality.mjs > m0-triaje-calidad.json
      - name: Guardar triaje M0
        uses: actions/upload-artifact@v4
        with:
          name: m0-triaje-calidad
          path: m0-triaje-calidad.json
          retention-days: 30
      - name: Guardar inventario por ID y nivel
        uses: actions/upload-artifact@v4
        with:
          name: m0-inventario-items
          path: m0-inventory-items.json
          retention-days: 30
      - name: Guardar matriz de alcance M0
        uses: actions/upload-artifact@v4
        with:
          name: m0-inventario
          path: m0-inventory.json
          retention-days: 30
      - name: M4 - impedir fuentes externas y telemetría de editor en producción
        run: node scripts/audit-m4-privacy.mjs > m4-privacy-guards.json
      - name: M4 - conservar guardas de privacidad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-first-party-privacy
          path: m4-privacy-guards.json
          if-no-files-found: error
          retention-days: 30
      - name: M4 - validar privacidad local, fallbacks e instalabilidad PWA
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m4-runtime.mjs > m4-runtime-compatibility.json
      - name: M4 - archivar evidencia de compatibilidad y almacenamiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-runtime-storage-pwa
          path: m4-runtime-compatibility.json
          if-no-files-found: error
          retention-days: 30
      - name: M4 - auditar 40500 posiciones, 810 celdas y cinco áreas
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m4-global.mjs > m4-global-audit.json
      - name: M4 - archivar matriz técnica transversal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-global-technical-baseline
          path: m4-global-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: M4 - medir construcción global y memoria real en Node CI
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m4-performance.mjs > m4-performance.json
      - name: M4 - conservar medición reproducible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-global-node-performance
          path: m4-performance.json
          if-no-files-found: error
          retention-days: 30
      - name: M4 - exigir contratos básicos de accesibilidad
        run: node scripts/audit-m4-accessibility.mjs > m4-accessibility.json
      - name: M4 - guardar auditoría accesible acotada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-accessibility-contracts
          path: m4-accessibility.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar cobertura del banco y objetivos de la Fase A
        run: bun run audit:content
      - name: Medir alcance real y déficit de M1 Español
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-area.mjs > m1-area-progress.json
      - name: Archivar avance y déficit de M1 Español
        uses: actions/upload-artifact@v4
        with:
          name: m1-espanol-avance
          path: m1-area-progress.json
          retention-days: 30
      - name: Auditar independencia operativa de tareas por juego
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-operations.mjs > m1-operation-audit.json
      - name: Conservar evidencia de independencia operativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-operaciones-cognitivas
          path: m1-operation-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Matemáticas M1 — 2970 respuestas con oráculos independientes
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-math-m1.mjs > matematicas-m1-audit.json
      - name: Auditar progresión cognitiva de los 2970 registros de Matemáticas M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-math-m1-cognitive.mjs > matematicas-m1-cognitiva.json
      - name: Conservar matriz de operaciones cognitivas M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matematicas-m1-progresion-cognitiva
          path: matematicas-m1-cognitiva.json
          if-no-files-found: error
          retention-days: 30
      - name: Archivar evidencia integral Matemáticas M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matematicas-m1-integral
          path: matematicas-m1-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Matemáticas M2 acumulado — 6600 registros, 198 celdas y 3630 nuevos
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-math-m2.mjs > matematicas-m2-integral.json
      - name: Conservar auditoría Matemáticas M2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matematicas-m2-integral
          path: matematicas-m2-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Matemáticas M3 completo — 9900 registros, 198 celdas y 3300 nuevos
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-math-m3.mjs > matematicas-m3-integral.json
      - name: Conservar auditoría Matemáticas M3 acumulada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matematicas-m3-integral
          path: matematicas-m3-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Ciencias Naturales M1 — 2565 registros y 171 celdas
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-science-m1.mjs > naturales-m1-integral.json
      - name: Conservar matriz de auditoría Naturales M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naturales-m1-integral
          path: naturales-m1-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Ciencias Naturales M2 — 5700 registros, 171 celdas, preservación de M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-science-m2.mjs > naturales-m2-integral.json
      - name: Conservar matriz de auditoría Naturales M2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naturales-m2-integral
          path: naturales-m2-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Naturales M3 — 8550 registros y 171 celdas, corte integral
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-science-m3.mjs > naturales-m3-corte.json
      - name: Archivar corte completo de Ciencias Naturales M3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: naturales-m3-corte
          path: naturales-m3-corte.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Ciencias Sociales M1 — 2700 registros y 180 celdas
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-social-m1.mjs > sociales-m1-integral.json
      - name: Conservar matriz y mutaciones Ciencias Sociales M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sociales-m1-integral
          path: sociales-m1-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Ciencias Sociales M2 — 6000 registros, 180 celdas, preservar M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-social-m2.mjs > sociales-m2-integral.json
      - name: Conservar auditoría integral Ciencias Sociales M2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sociales-m2-integral
          path: sociales-m2-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Ciencias Sociales M3 — 9000 registros, 180 celdas y preservación M1/M2
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-social-m3.mjs > sociales-m3-corte.json
      - name: Conservar corte completo de Ciencias Sociales M3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sociales-m3-corte
          path: sociales-m3-corte.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar corte integral Ciencias Sociales — 9000 IDs, 180 celdas, 1800 mutaciones
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-social-cut.mjs > sociales-corte-integral.json
      - name: Conservar manifiesto de 9000 hashes y matriz del corte de Sociales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sociales-corte-integral
          path: sociales-corte-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Habilidades Blandas M1 — 1080 registros, 72 celdas, 576 mutaciones
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-soft-m1.mjs > blandas-m1-integral.json
      - name: Conservar auditoría Habilidades Blandas M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blandas-m1-integral
          path: blandas-m1-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Habilidades Blandas M2 — 2400 registros, 72 celdas, preservar M1 y 720 mutaciones
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-soft-m2.mjs > blandas-m2-integral.json
      - name: Conservar auditoría acumulativa Habilidades Blandas M2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blandas-m2-integral
          path: blandas-m2-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar Habilidades Blandas M3 — 3600 registros, 72 celdas, 720 mutaciones
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-soft-m3.mjs > blandas-m3-integral.json
      - name: Conservar auditoría acumulativa Habilidades Blandas M3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blandas-m3-integral
          path: blandas-m3-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar CORTE integral Habilidades Blandas — 3600 registros, 72 celdas, 720 mutaciones y hashes
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-soft-cut.mjs > blandas-corte-integral.json
      - name: Conservar manifiesto integral de 3600 hashes y matriz de Blandas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blandas-corte-integral
          path: blandas-corte-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar claridad, ambigüedad y competencia por ejercicio
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-clarity-competency.mjs > claridad-competencia-espanol.json
      - name: Archivar matriz editorial por ID, tema y subtema
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claridad-competencia-espanol
          path: claridad-competencia-espanol.json
          retention-days: 30
          if-no-files-found: error
      - name: Auditar calidad de retroalimentación de Español
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-feedback-quality.mjs > paridad-retroalimentacion.json
      - name: Archivar auditoría pedagógica de 189 celdas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paridad-explicaciones-espanol
          path: paridad-retroalimentacion.json
          retention-days: 30
          if-no-files-found: warn
      - name: Auditar integralmente M3 y corte completo de Español
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m3-area.mjs > m3-area-audit.json
      - name: Conservar reporte completo M3 por SHA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-espanol-corte-integral
          path: m3-area-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar aceptación M2 de 3440 casos y 189 celdas
        run: |
          node --import ./scripts/ts-resolve.mjs scripts/audit-m2-area.mjs > m2-auditoria-integral.raw
          python3 - <<'PY'
          import json, pathlib
          source = pathlib.Path("m2-auditoria-integral.raw").read_text()
          decoder = json.JSONDecoder()
          reports = []
          while source.strip():
              report, offset = decoder.raw_decode(source.lstrip())
              reports.append(report)
              source = source.lstrip()[offset:]
          assert reports, "Auditoría M2 sin resultados"
          report = reports[-1]
          assert report.get("module") == "espanol-M2" and report.get("status") == "PASS", "Auditoría M2 no aprobada"
          assert report.get("summary", {}).get("m2_new") == 3440
          assert report["summary"]["missing"] == 0
          pathlib.Path("m2-auditoria-integral.json").write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n")
          print("Reporte M2 JSON único verificado")
          PY
      - name: Medir rendimiento y memoria de catálogo M3 completo
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m3-performance.mjs > m3-performance.json
      - name: Archivar métricas M3 con contexto de ejecución
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-performance
          path: m3-performance.json
          if-no-files-found: error
          retention-days: 30
      - name: Guardar auditoría reproducible M2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-auditoria-integral
          path: m2-auditoria-integral.json
          if-no-files-found: error
          retention-days: 30
      - name: Verificar aceptación técnica M1 y déficit en 189 celdas
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-technical-acceptance.mjs > m1-technical-acceptance.json
      - name: Archivar validación de celdas de M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-aceptacion-tecnica-189
          path: m1-technical-acceptance.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar 855 registros M1 contra estímulos fuente
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-source-consistency.mjs > m1-oraculos-855.json
      - name: Archivar oráculos de 855 registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-oraculos-855
          path: m1-oraculos-855.json
          if-no-files-found: error
          retention-days: 30
      - name: Reconciliar independencia y 240 familias de M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-families.mjs > m1-family-review.json
      - name: Guardar matriz de familias compartidas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-familias-240
          path: m1-family-review.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar 225 claves M1 con oráculos por fuente y 675 mutantes
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-quiz-oracles.mjs > m1-oraculos-225.json
      - name: Guardar oráculos y prueba negativa M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-oraculos-225
          path: m1-oraculos-225.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar 270 registros nuevos de Literatura M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-literature.mjs > m1-literature-270.json
      - name: Archivar auditoría M1 Literatura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-literatura-270
          path: m1-literature-270.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar 405 registros nuevos de M1
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-next.mjs > m1-next-405.json
      - name: Archivar auditoría por ID de 405 registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-bloque-405-auditoria
          path: m1-next-405.json
          if-no-files-found: error
          retention-days: 30
      - name: Auditar núcleo M1 — contenido y claves estructurales
        run: node --import ./scripts/ts-resolve.mjs scripts/audit-m1-nucleus.mjs > m1-nucleus-audit.json
      - name: Archivar auditoría de 180 ejercicios M1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-nucleo-180-auditoria
          path: m1-nucleus-audit.json
          if-no-files-found: error
          retention-days: 30
      - name: Evidencia ejecutable de M0 (cierre independiente)
        if: always()
        shell: bash
        run: |
          set +e
          python3 scripts/qa_m0.py --output m0-evidence.json
          code=$?
          echo "Runner de M0: salida $code; cero significa cierre de todas las etapas, uno significa bloqueo documentado." >> "$GITHUB_STEP_SUMMARY"
          test -f m0-evidence.json
          echo "$code" > m0-exit-code.txt
      - name: Verificar integridad independiente del resultado M0
        if: always()
        run: |
          python3 scripts/verify_m0_report.py --report m0-evidence.json > m0-verification.json
          python3 scripts/audit_stem_m0_overlap.py --report m0-evidence.json > m0-stem-overlap.json
          cat m0-stem-overlap.json
      - name: Guardar evidencia M0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-auditoria
          path: |
            m0-evidence.json
            m0-verification.json
            m0-stem-overlap.json
          if-no-files-found: warn
          retention-days: 14
      - name: Comprobar código
        run: |
          bunx eslint . --rule "prettier/prettier: off"
      - name: Prueba HTTP publicada de Español, Matemáticas M3 y Naturales M1
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          base="https://desafio-gramatical.onrender.com"
          for route in "/" "/blandas" "/blandas?subtema=Respeto&modo=quiz&nivel=intermedio" "/sociales" "/sociales?subtema=C%C3%A9lula&modo=desconocido&nivel=no" "/jugar?modo=quiz&nivel=principiante&subtema=Hiperonimia" "/jugar?modo=construir&nivel=principiante&subtema=Morfosintaxis" "/lectura?subtema=Idea%20principal&modo=quiz&nivel=principiante" "/redaccion?subtema=Conectores&modo=quiz&nivel=principiante" "/jugar?modo=clasificar&nivel=intermedio&subtema=Morfosintaxis" "/lectura?subtema=Inferencias&modo=construir&nivel=avanzado" "/redaccion?subtema=Correcci%C3%B3n&modo=quiz&nivel=intermedio" "/jugar?modo=clasificar&nivel=avanzado&subtema=Hiperonimia" "/lectura?subtema=Lectura%20comparada&modo=quiz&nivel=avanzado" "/redaccion?subtema=Generalizaci%C3%B3n%20e%20integraci%C3%B3n&modo=construir&nivel=avanzado" "/matematicas?subtema=Operaciones&modo=clasificar&nivel=principiante" "/matematicas?subtema=Pit%C3%A1goras&modo=construir&nivel=intermedio" "/matematicas?subtema=Funciones&modo=quiz&nivel=avanzado" "/matematicas?subtema=Tablas%20y%20gr%C3%A1ficas&modo=quiz&nivel=avanzado" "/matematicas?subtema=S%C3%B3lidos%3A%20%C3%A1rea%20y%20volumen&modo=clasificar&nivel=avanzado" "/naturales?subtema=C%C3%A9lula&modo=clasificar&nivel=principiante" "/naturales?subtema=Compuestos%20inorg%C3%A1nicos&modo=quiz&nivel=intermedio" "/naturales?subtema=Movimiento&modo=construir&nivel=avanzado" "/sociales?subtema=Independencia&modo=clasificar&nivel=principiante" "/sociales?subtema=Husos%20horarios&modo=quiz&nivel=intermedio" "/sociales?subtema=Constituci%C3%B3n%20y%20derechos&modo=construir&nivel=avanzado"; do
            file="$(mktemp)"
            code=$(curl --fail --location --silent --show-error --retry 4 --retry-delay 7 --retry-all-errors --max-time 50 --output "$file" --write-out '%{http_code}' "$base$route")
            if ! grep -Eiq '<html|<!doctype html' "$file"; then
              echo "::error::La ruta $route no devolvió HTML"
              exit 1
            fi
            echo "$route -> HTTP $code, HTML válido" | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$file"
          done
      - name: Aplicar puerta de cierre M0
        if: always()
        shell: bash
        run: |
          if [ ! -f m0-exit-code.txt ]; then
            echo "::error::M0 no produjo resultado ejecutable"
            exit 2
          fi
          code=$(cat m0-exit-code.txt)
          if [ "$code" -ne 0 ]; then
            echo "::error::M0 BLOQUEADO: reporte m0-auditoria adjunto; controles obligatorios sin PASS"
            exit "$code"
          fi
          python3 scripts/verify_m0_report.py --report m0-evidence.json --require-closure
          echo "M0: todos los controles obligatorios PASS" >> "$GITHUB_STEP_SUMMARY"

  navegador_m4:
    name: M4 - navegadores reales y privacidad de solicitudes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Obtener código del SHA a probar
        uses: actions/checkout@v4
      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Preparar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Construir exactamente el checkout
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Instalar navegadores aislados
        run: |
          npm install --prefix /tmp/m4-playwright --no-package-lock --no-audit --no-fund playwright@1.56.1
          /tmp/m4-playwright/node_modules/.bin/playwright install --with-deps chromium firefox
      - name: Instalar Wrangler fuera del proyecto
        run: npm install --prefix /tmp/m4-wrangler --no-package-lock --no-audit --no-fund wrangler@4.50.0
      - name: Servir compilación local y verificar navegadores
        shell: bash
        run: |
          set -euo pipefail
          /tmp/m4-wrangler/node_modules/.bin/wrangler dev --config .output/server/wrangler.json --local --port 4173 --ip 127.0.0.1 > /tmp/m4-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4173/ > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then cat /tmp/m4-preview.log; exit 1; fi
          M4_PLAYWRIGHT_ROOT=/tmp/m4-playwright M4_BASE_URL=http://127.0.0.1:4173 node scripts/audit-m4-browser.mjs
          M4_PLAYWRIGHT_ROOT=/tmp/m4-playwright M4_BASE_URL=http://127.0.0.1:4173 node scripts/audit-game-progression.mjs
          M4_PLAYWRIGHT_ROOT=/tmp/m4-playwright M4_BASE_URL=http://127.0.0.1:4173 node scripts/audit-spanish-navigation.mjs
      - name: Conservar capturas y solicitudes de red
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-real-browser-privacy-accessibility
          path: |
            m4-browser-evidence/
            m4-gameplay-evidence/
            m4-spanish-evidence/
          if-no-files-found: warn
          retention-days: 30
